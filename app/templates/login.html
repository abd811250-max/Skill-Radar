{% extends "base.html" %}
{% block title %}Login - SkillRadar{% endblock %}
{% block content %}
<section class="auth-page"><form class="auth-card" method="post"><a class="brand" href="/"><span class="brand-mark">S</span><span>SkillRadar</span></a><h1>Welcome back</h1><p class="muted">Sign in to continue to your skill dashboard.</p>
<label>Email address<input type="email" name="email" required autocomplete="email"></label>
<label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button class="button primary full" type="submit">Log in</button><p class="auth-switch">New to SkillRadar? <a href="{{ url_for('auth.register') }}">Create an account</a></p></form></section>
{% endblock %}
