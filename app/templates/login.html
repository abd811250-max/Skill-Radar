{% extends "base.html" %}
{% block title %}Login - SkillRadar{% endblock %}

{% block content %}
<section class="auth-page">
  <form class="auth-card" method="post" data-enhance-form novalidate>
    <a class="brand" href="{{ url_for('auth.landing') }}">
      <span class="brand-mark">S</span>
      <span>SkillRadar</span>
    </a>
    <h1>Welcome back</h1>
    <p class="auth-subtitle">Sign in to access your skill intelligence workspace.</p>

    <label>
      Email address
      <input type="email" name="email" placeholder="you@college.edu" required autocomplete="email">
    </label>

    <label>
      Password
      <div class="input-password-wrap">
        <input id="loginPassword" type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
        <button class="password-toggle" type="button" data-toggle-password="loginPassword" aria-label="Toggle password visibility" aria-pressed="false">Show</button>
      </div>
    </label>

    <button class="button primary full mt-16" type="submit" data-loading-text="Signing in...">Log in</button>

    <div class="auth-footer-links">
      <span>New to SkillRadar? <a href="{{ url_for('auth.register') }}">Create an account</a></span>
      <a href="{{ url_for('auth.landing') }}">Back to home</a>
    </div>
  </form>
</section>
{% endblock %}
